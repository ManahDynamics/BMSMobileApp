name: bmsmobileapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.3.0
  flutter_svg: ^2.0.10+1

  # Storage & Security
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^10.3.1

  # Bluetooth
  flutter_blue_plus: ^1.35.0
  permission_handler: ^11.3.1

  # Network
  http: ^1.6.0

  # Device Info
  device_info_plus: ^13.1.0

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0

  # Splash Screen
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.svg
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_logo.svg
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash_logo.svg
    - assets/images/logo.svg